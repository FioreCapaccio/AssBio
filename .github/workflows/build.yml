name: Build desktop app

# Si avvia in due casi:
#  - push di un tag "v*" (es. v2.9.4) -> compila Windows e macOS, poi un job separato
#    pubblica UNA sola bozza di Release su GitHub con tutti gli installer
#  - avvio manuale da GitHub (tab Actions -> Build desktop app -> Run workflow) -> compila
#    e carica gli installer come artifact scaricabili, senza creare/toccare alcuna release
#    (il job "release" gira solo su push di tag, vedi "if" più sotto)
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Il GITHUB_TOKEN generato per ogni run ha di default il solo permesso "contents: read":
# senza questo blocco, il job "release" riceve un 403 ("Resource not accessible by
# integration") quando prova a creare la release sul tag.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installa dipendenze
        run: npm install

      # BUG FIX: entrambi i job (mac e windows) giravano in parallelo e ciascuno provava a
      # pubblicare DIRETTAMENTE su GitHub (electron-builder pubblica in automatico quando
      # trova un tag v* e un GH_TOKEN, per via del blocco "publish" in package.json). I due
      # job non si accorgevano l'uno dell'altro: capitava che entrambi non trovassero ancora
      # nessuna release per quel tag e la creassero CIASCUNO per conto proprio, risultando
      # in due bozze duplicate — una con i soli asset Mac, una con i soli asset Windows
      # (osservato realmente su v2.9.8). Ora ogni job si limita a compilare ("--publish
      # never", nessun GH_TOKEN necessario qui) e carica il risultato come artifact; la
      # pubblicazione vera e propria avviene una sola volta, nel job "release" qui sotto.
      - name: Build macOS (.dmg/.zip)
        if: matrix.os == 'macos-latest'
        run: npm run dist:mac -- --publish never

      - name: Build Windows (.exe)
        if: matrix.os == 'windows-latest'
        run: npm run dist:win -- --publish never

      - name: Carica artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: |
            dist_electron/*.dmg
            dist_electron/*.zip
            dist_electron/*.exe
            dist_electron/*.blockmap
            dist_electron/*.yml
          if-no-files-found: error

  release:
    # Solo su push di un tag v* — un run manuale (workflow_dispatch) si ferma al job "build"
    # e lascia solo gli artifact scaricabili, senza toccare alcuna Release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Scarica gli installer di entrambe le piattaforme
        uses: actions/download-artifact@v4
        with:
          pattern: build-*
          path: dist_electron
          merge-multiple: true

      - name: Pubblica un'unica bozza di release con tutti gli installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" dist_electron/* \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --draft \
            --generate-notes
